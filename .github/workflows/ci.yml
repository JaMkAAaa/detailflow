name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/detailflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  db:
    name: migrate + seed + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: detailflow
          POSTGRES_PASSWORD: detailflow
          POSTGRES_DB: detailflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detailflow -d detailflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://detailflow:detailflow@localhost:5432/detailflow
      KSEF_REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      # Schemat w repo musi zgadzać się z migracjami.
      - run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: playwright smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: detailflow
          POSTGRES_PASSWORD: detailflow
          POSTGRES_DB: detailflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detailflow -d detailflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://detailflow:detailflow@localhost:5432/detailflow
      REDIS_URL: redis://127.0.0.1:6379
      APP_URL: http://127.0.0.1:3100
      AUTH_SECRET: ci-e2e-auth-secret-0123456789abcdef
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: detailflow
      S3_ACCESS_KEY: detailflow
      S3_SECRET_KEY: detailflow-dev-secret
      STRIPE_SECRET_KEY: sk_test_e2e_detailflow
      STRIPE_WEBHOOK_SECRET: whsec_e2e_detailflow
      STRIPE_API_HOST: 127.0.0.1
      STRIPE_API_PORT: "12119"
      STRIPE_API_PROTOCOL: http
      KSEF_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
      - run: pnpm test:e2e:smoke
